name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject generated files in Git
        run: scripts/check-repository.sh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run failure tests
        run: scripts/ci-verify.sh verify
      - name: Verify JDK-only core runtime
        shell: bash
        run: test "$(jdeps --print-module-deps filegate-core/target/filegate-core-0.1.0-SNAPSHOT.jar)" = java.base
      - name: Build immutable Linux containment fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker pull eclipse-temurin:21-jre
          base_image=$(docker image inspect --format '{{index .RepoDigests 0}}' eclipse-temurin:21-jre)
          jar --create --file filegate-worker/target/worker-test-fixtures.jar -C filegate-worker/target/test-classes .
          jar --create --file filegate-spreadsheets-worker/target/spreadsheet-test-fixtures.jar -C filegate-spreadsheets-worker/target/test-classes .
          docker build --build-arg BASE_IMAGE="$base_image" --iidfile /tmp/filegate-worker-image -f deploy/linux/Dockerfile.smoke .
      - name: Test effective Linux restrictions and timeout cleanup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export FILEGATE_DOCKER_IMAGE=$(cat /tmp/filegate-worker-image)
          mvn -o -B -ntp verify
      - name: Diagnose synthetic spreadsheet worker failure
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          if test -f filegate-examples/target/synthetic-spreadsheet-request.bin; then
            image=$(cat /tmp/filegate-worker-image)
            trap 'docker rm -f filegate-synthetic-diagnostic >/dev/null 2>&1 || true' EXIT
            timeout 45s docker run --name filegate-synthetic-diagnostic --rm --network=none --read-only \
              --user 65534:65534 --cap-drop=ALL --security-opt=no-new-privileges=true --ipc=none --cgroupns=private \
              --memory=536870912 --memory-swap=536870912 --cpu-period=100000 --cpu-quota=100000 --pids-limit=128 \
              --ulimit=core=0:0 --ulimit=nofile=64:64 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777 \
              --workdir=/tmp --env=HOME=/tmp --entrypoint=java -i "$image" \
              -Xmx268435456 -XX:-UsePerfData -cp '/app/*' \
              dev.filegate.spreadsheets.worker.SyntheticSpreadsheetDiagnostic \
              536870912 67108864 128 1000 1048576 8388608 2097152 128 64 100000 2097152 \
              8 1000 10000 1000 100 8192 4096 32767 HTTPS_ONLY \
              < filegate-examples/target/synthetic-spreadsheet-request.bin > /tmp/synthetic-spreadsheet-response.bin
          fi
      - name: Generate Maven runtime SBOM
        if: runner.os == 'Linux'
        run: scripts/ci-verify.sh -Psbom org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - name: Verify artifact notices and inventory
        if: runner.os == 'Linux'
        run: python3 scripts/check-distribution.py
      - name: Preserve Maven runtime SBOM
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-runtime-sbom
          path: target/bom.json
          if-no-files-found: error
          retention-days: 30
