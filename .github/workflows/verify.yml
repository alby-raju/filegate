name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run failure tests
        run: mvn -B -ntp verify
      - name: Verify JDK-only core runtime
        shell: bash
        run: test "$(jdeps --print-module-deps filegate-core/target/filegate-core-0.1.0-SNAPSHOT.jar)" = java.base
